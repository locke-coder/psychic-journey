gates:
  - gate_id: G09
    gate_name: Forecast Models Gate
    phase: forecast_models
    required_files:
      - src/forecast_models.py
      - tests/test_forecast_models.py
    pytest_targets:
      - tests/test_forecast_models.py
    required_keywords:
      - target_status
      - target_variance
      - surplus_to_target
      - UNDER_TARGET
      - ON_TARGET
      - OVER_TARGET
      - gap_to_target
      - forecast_amount
      - monthly_target
    required_test_patterns:
      - file: tests/test_forecast_models.py
        label: OVER_TARGET status assertion
        any_of:
          - 'target_status"] == OVER_TARGET'
          - "target_status'] == OVER_TARGET"
      - file: tests/test_forecast_models.py
        label: surplus_to_target positive assertion
        any_of:
          - 'surplus_to_target"] > 0'
          - "surplus_to_target'] > 0"
          - 'surplus_to_target"] == pytest.approx(40.0)'
          - "surplus_to_target'] == pytest.approx(40.0)"
      - file: tests/test_forecast_models.py
        label: gap_to_target zero or max guard assertion
        any_of:
          - 'gap_to_target"] == 0'
          - "gap_to_target'] == 0"
          - 'gap_to_target"] == pytest.approx(0)'
          - "gap_to_target'] == pytest.approx(0)"
          - 'gap_to_target"] == pytest.approx(0.0)'
          - "gap_to_target'] == pytest.approx(0.0)"
          - "max(0,"
          - "max(0.0,"
    forbidden_patterns:
      - ".weekday("
      - "dt.weekday"
      - "weekday("
      - "next_monday"
      - "next_thursday"
      - "day_name =="
      - "day_name in"
      - "월요일"
      - "목요일"
    warning_keywords: []
    pass_conditions:
      - Forecast outputs expose target status, target variance, and surplus fields.
      - Forecast status separates UNDER_TARGET, ON_TARGET, and OVER_TARGET.
      - Close-day logic is based only on is_close_day.

  - gate_id: G10
    gate_name: Provision / Overachievement Gate
    phase: provision_overachievement
    required_files:
      - src/provision_models.py
      - src/overachievement_models.py
      - tests/test_provision_models.py
      - tests/test_overachievement_models.py
    pytest_targets:
      - tests/test_provision_models.py
      - tests/test_overachievement_models.py
    required_keywords:
      - O1_TARGET_HOLD_BUFFER
      - O2_STRETCH_TARGET_CAPTURE
      - O3_QUALITY_GUARD_RELIEF
      - stretch_capture_rate
      - stretch_uplift
      - revised_monthly_target
      - remaining_surplus_buffer
      - minimum_remaining_to_hit_target
      - relief_amount
      - surplus_to_target
      - OVER_TARGET
    required_test_patterns:
      - file: tests/test_overachievement_models.py
        label: O1 strategy test exists
        any_of:
          - test_o1_holds_target_and_keeps_surplus_as_buffer
      - file: tests/test_overachievement_models.py
        label: O1 required_uplift remains zero
        any_of:
          - 'required_uplift"] == pytest.approx(0.0)'
          - "required_uplift'] == pytest.approx(0.0)"
      - file: src/overachievement_models.py
        label: O2 stretch_capture_rate default is 0.5
        any_of:
          - '_config_get(config, "stretch_capture_rate", 0.5)'
      - file: tests/test_overachievement_models.py
        label: O2 default captures half of surplus
        any_of:
          - test_o2_captures_half_of_surplus_as_stretch_target_by_default
      - file: src/overachievement_models.py
        label: O3 quality guard wording
        any_of:
          - 계약 품질
          - 품질
      - file: src/overachievement_models.py
        label: O3 cancellation and payment risk wording
        any_of:
          - 취소
          - 철회
          - 미결제
      - file: tests/test_provision_models.py
        label: CAPACITY_LIMITED status assertion
        any_of:
          - 'status"] == CAPACITY_LIMITED'
          - "status'] == CAPACITY_LIMITED"
      - file: tests/test_provision_models.py
        label: CAPACITY_LIMITED keeps unallocated uplift visible
        any_of:
          - 'unallocated_uplift"] >= 0'
          - "unallocated_uplift'] >= 0"
          - 'unallocated_uplift"] == pytest.approx(3.0)'
          - "unallocated_uplift'] == pytest.approx(3.0)"
    forbidden_context_patterns:
      - label: CAPACITY_LIMITED must not be shown as achievable
        anchor: CAPACITY_LIMITED
        forbidden_any:
          - 목표 달성 가능
          - 목표달성 가능
          - 목표 달성이 가능
          - achievable
          - can hit target
        window: 3
    forbidden_patterns:
      - ".weekday("
      - "dt.weekday"
      - "weekday("
      - "next_monday"
      - "next_thursday"
      - "day_name =="
      - "day_name in"
      - "월요일"
      - "목요일"
    warning_keywords: []
    pass_conditions:
      - Overachievement strategies O1, O2, and O3 are implemented.
      - Overachievement metrics expose stretch, buffer, and relief amounts.
      - Provision scenarios remain available for under-target forecasts.

  - gate_id: G12
    gate_name: Scenario Runner Gate
    phase: scenario_runner
    required_files:
      - src/scenario_runner.py
      - tests/test_scenario_runner.py
    pytest_targets:
      - tests/test_scenario_runner.py
    required_keywords:
      - target_status
      - strategy_type
      - PROVISION
      - OVERACHIEVEMENT
      - NEUTRAL
      - OVER_TARGET
      - UNDER_TARGET
      - ON_TARGET
      - O1_TARGET_HOLD_BUFFER
      - O2_STRETCH_TARGET_CAPTURE
      - O3_QUALITY_GUARD_RELIEF
      - surplus_to_target
    required_test_patterns:
      - file: tests/test_scenario_runner.py
        label: scenario grid keeps nine rows
        any_of:
          - "assert result.shape[0] == 9"
      - file: tests/test_scenario_runner.py
        label: UNDER_TARGET branch remains covered
        any_of:
          - 'set(result["target_status"]) == {UNDER_TARGET}'
          - "set(result['target_status']) == {UNDER_TARGET}"
      - file: tests/test_scenario_runner.py
        label: P1 scenario remains covered
        any_of:
          - "assert (F1_CUMULATIVE_RATE, P1_ALL_REMAINING) in combinations"
      - file: tests/test_scenario_runner.py
        label: P2 scenario remains covered
        any_of:
          - "assert (F2_LAST_TWO_CLOSES, P2_CLOSE_DAY_FOCUSED) in combinations"
      - file: tests/test_scenario_runner.py
        label: P3 scenario remains covered
        any_of:
          - "assert (F3_DAY_CLOSE_WEIGHTED, P3_NON_CLOSE_DAY_FOCUSED) in combinations"
      - file: tests/test_scenario_runner.py
        label: OVER_TARGET branch returns O1
        any_of:
          - "        O1_TARGET_HOLD_BUFFER,"
      - file: tests/test_scenario_runner.py
        label: OVER_TARGET branch returns O2
        any_of:
          - "        O2_STRETCH_TARGET_CAPTURE,"
      - file: tests/test_scenario_runner.py
        label: OVER_TARGET branch returns O3
        any_of:
          - "        O3_QUALITY_GUARD_RELIEF,"
      - file: tests/test_scenario_runner.py
        label: OVER_TARGET branch is not reduced to NO_GAP
        any_of:
          - '"NO_GAP" not in set(result["status"])'
          - "'NO_GAP' not in set(result['status'])"
    forbidden_patterns:
      - ".weekday("
      - "dt.weekday"
      - "weekday("
      - "next_monday"
      - "next_thursday"
      - "day_name =="
      - "day_name in"
      - "월요일"
      - "목요일"
    warning_keywords: []
    pass_conditions:
      - Scenario Runner branches UNDER_TARGET, ON_TARGET, and OVER_TARGET.
      - OVER_TARGET scenarios use overachievement strategies, not NO_GAP only.
      - Scenario output includes target_status and surplus_to_target.

